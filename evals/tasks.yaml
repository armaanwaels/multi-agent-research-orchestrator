    - {sql: "SELECT solar_share_elec FROM energy WHERE country='China' AND year=2015", expect: 0.679}

- id: t32-france-nuclear
  question: How much of France's electricity came from nuclear power in 2024 and 2025, and how does France rank globally for nuclear share?
  sources: [sql, docs]
  reference: >-
    Nuclear supplied about 67.7% of France's electricity in 2024 (380.45 TWh) and about 68.8% in 2025
    (392.07 TWh). EIA notes France has the world's highest nuclear share of national generation (about 68% in 2021)
    and the second-largest nuclear capacity after the United States.
  checks:
    - {sql: "SELECT nuclear_share_elec FROM energy WHERE country='France' AND year=2024", expect: 67.722}
    - {sql: "SELECT nuclear_share_elec FROM energy WHERE country='France' AND year=2025", expect: 68.787}
